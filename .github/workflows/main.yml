name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build, test and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f RustBucketRacing-Godot.zip ]; then rm -rf unpacked; unzip -q RustBucketRacing-Godot.zip -d unpacked; fi
          script="$(find . -path ./.git -prune -o -path '*/ci/build.sh' -print | head -n 1)"
          if [ -z "$script" ]; then echo "ci/build.sh not found: upload the latest RustBucketRacing-Godot.zip"; exit 1; fi
          bash "$script"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RustBucketRacing-build
          path: out/
          if-no-files-found: ignore
