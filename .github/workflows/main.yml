name: Build Android APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Find the project
        run: |
          if [ ! -f project.godot ] && [ -f RustBucketRacing-Godot.zip ]; then unzip -q RustBucketRacing-Godot.zip -d unpacked; fi
          dir="$(dirname "$(find . -name project.godot -not -path './.git/*' | head -n 1)")"
          test -n "$dir" && test -f "$dir/project.godot"
          echo "PROJ=$(cd "$dir" && pwd)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot (.NET) and its export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" -d "$HOME/godot"
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" -d "$HOME/tpl"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$tdir"
          mv "$HOME"/tpl/templates/* "$tdir/"
          rm -f ./*.zip ./*.tpz
          bin="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      - name: Debug keystore and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p "$HOME/.config/godot"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          for f in "editor_settings-${GODOT_VERSION%.*}.tres" "editor_settings-4.tres"; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/android_sdk_path = \"$sdk\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$f"
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Compile the C#
        working-directory: ${{ env.PROJ }}
        run: dotnet build RustBucket.csproj -c Debug -nologo -clp:"ErrorsOnly;Summary" 2>&1 | tee csharp-build.log; exit ${PIPESTATUS[0]}

      - name: Import the project (models, textures, shaders)
        working-directory: ${{ env.PROJ }}
        run: timeout 900 "$GODOT" --headless --import 2>&1 | tee import.log || true

      - name: Export the APK
        working-directory: ${{ env.PROJ }}
        run: |
          mkdir -p build
          "$GODOT" --headless --export-debug "Android" build/RustBucketRacing.apk 2>&1 | tee export.log
          test -s build/RustBucketRacing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RustBucketRacing-apk
          path: ${{ env.PROJ }}/build/RustBucketRacing.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: ${{ env.PROJ }}/*.log
          if-no-files-found: ignore
